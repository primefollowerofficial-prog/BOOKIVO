<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Bookivo.in</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BOOKIVO site shell -->
<div id="siteHeader"></div>

<main class="cart-page">
  <h1 class="cart-title">Your Cart</h1>

  <!-- Filled state (multi-item) -->
  <div class="cart-wrap" id="cartFilled" hidden>
    <div class="cart-lines" id="cartLines"><!-- populated by cart.js --></div>

    <div class="cart-summary">
      <div class="cart-summary-row">
        <span>Subtotal</span>
        <span id="cartSubtotal">₹0</span>
      </div>
      <div class="cart-summary-row cart-summary-total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <button class="btn btn-primary btn-shine cart-buy-btn" id="cartBuyNowBtn">Proceed to Checkout</button>
      <a href="books.html" class="cart-continue">← Continue shopping</a>
    </div>
  </div>


  <!-- Empty state -->
  <div class="cart-empty" id="cartEmpty" hidden>
    <div class="cart-empty-icon">🛍️</div>
    <h2>Your cart is empty</h2>
    <p>Looks like you haven't added anything worth reading yet.</p>
    <a href="books.html" class="btn btn-primary">Explore Books</a>
  </div>
</main>

<!-- Checkout modal (same as index.html, so Buy Now works from the cart page too) -->
<div class="checkout-overlay" id="checkoutOverlay" aria-hidden="true">
  <div class="checkout-modal" role="dialog" aria-modal="true" aria-label="Checkout">
    <button type="button" class="checkout-close" id="checkoutClose" aria-label="Close">✕</button>
    <h3 class="checkout-title">Complete your purchase</h3>
    <p class="checkout-subtitle">Bachelor 99 Survival Cookbook · <span id="checkoutQtyLabel">1 copy</span></p>

    <form id="checkoutForm" class="checkout-form" novalidate>
      <label class="checkout-field">
        <span>Full Name</span>
        <input type="text" id="checkoutName" name="customerName" autocomplete="name" required placeholder="e.g. Rahul Sharma">
      </label>
<label class="checkout-field">
  <span>Email Address</span>
  <div class="email-verify-row">
    <input type="email" id="checkoutEmail" name="email" autocomplete="email" required placeholder="you@example.com">
    <button type="button" class="email-verify-btn" id="emailVerifyBtn">Verify</button>
  </div>
  <div class="otp-row" id="otpRow" hidden>
    <input type="text" id="otpInput" placeholder="Enter OTP" inputmode="numeric" maxlength="6" autocomplete="off">
    <button type="button" class="otp-verify-btn" id="otpVerifyBtn">Verify OTP</button>
  </div>
  <p class="email-verify-message" id="emailVerifyMessage" hidden></p>
</label>
 
      <label class="checkout-field">
        <span>Phone Number</span>
        <input type="tel" id="checkoutPhone" name="phone" autocomplete="tel" required placeholder="10-digit mobile number" inputmode="numeric" maxlength="10">
      </label>

      <p class="checkout-error" id="checkoutError" hidden></p>

      <div class="coupon-block">
        <button type="button" class="coupon-toggle" id="couponToggle">I have a coupon code</button>
        <div class="coupon-row" id="couponRow" hidden>
          <input type="text" id="couponInput" placeholder="Enter coupon code" autocomplete="off">
          <button type="button" class="coupon-apply-btn" id="couponApplyBtn">Apply</button>
        </div>
        <p class="coupon-message" id="couponMessage" hidden></p>
      </div>

      <div class="checkout-total-row">
        <span>Total</span>
        <span id="checkoutTotal">₹99</span>
      </div>

      <button type="submit" class="btn btn-primary btn-shine checkout-submit" id="checkoutSubmit">
        <span class="checkout-submit-label">BUY NOW</span>
      </button>
      <p class="checkout-secure-note">🔒 Secure payment powered by Cashfree</p>
    </form>
  </div>
</div>

<div id="siteFooter"></div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="cart-shared.js"></script>
<script src="site-shared.js"></script>
<script>BookivoSite.mount('');</script>
<script src="cart.js"></script>
<script src="checkout.js"></script>
</body>
</html>
